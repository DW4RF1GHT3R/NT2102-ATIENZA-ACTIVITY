<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Account Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* main */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            /* background */
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                              url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSg0Wp23qCH8PJm5RgBJV4wG9qGAvaE36vYFvlsz5Uz6w&s=10');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* card container */
        .form-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            color: #ffffff;
        }

        .form-card h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* input field */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #e0e0e0;
            font-weight: 500;
        }

        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field input {
            width: 100%;
            padding: 12px 42px 12px 40px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-field input::placeholder {
            color: #cccccc;
        }

        .input-field input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .validation-error {
            display: block;
            margin-top: 6px;
            color: #ffd1d1;
            font-size: 12px;
        }

        .success-message {
            margin-top: 12px;
            color: #c9ffdf;
            text-align: center;
            font-size: 13px;
        }

        input.validation-error {
            border-color: #ff8f8f;
        }

        .input-field i {
            position: absolute;
            left: 14px;
            color: #dddddd;
            font-size: 15px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #ffffff;
            cursor: pointer;
        }

        .toggle-password:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* button */
        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: #ffffff;
            color: #1a1a1a;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .submit-btn:hover {
            background: #e6e6e6;
            transform: translateY(-2px);
        }

        /* footer link */
        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .form-footer a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: underline;
            margin-left: 5px;
        }

        .form-footer a:hover {
            color: #dddddd;
        }

        /* mobile view breakpoints */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .form-card {
                padding: 25px 20px;
                border-radius: 12px;
            }

            .form-card h2 {
                font-size: 24px;
            }
            
            .input-field input {
                padding: 10px 42px 10px 36px;
            }
        }
    </style>
</head>
<body>

    <main class="form-card">
        <h2>Register</h2>
        <form id="register-form" action="#" method="POST" novalidate>
            
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-field">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Enter email address" required>
                </div>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <div class="input-field">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <button type="button" class="toggle-password" aria-label="Show password" title="Show password" aria-controls="password">
                        <i class="fa-solid fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-field">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm password" required>
                    <button type="button" class="toggle-password" aria-label="Show confirm password" title="Show confirm password" aria-controls="confirm-password">
                        <i class="fa-solid fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn">Register</button>
            <p id="registration-feedback" class="success-message" role="status" aria-live="polite" hidden></p>

            <div class="form-footer">
                <span>Already have an account?</span><a href="login.html">Login Here</a>
            </div>

        </form>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>
    <script>
        $(function () {
            $(".toggle-password").on("click", function () {
                const input = document.getElementById(this.getAttribute("aria-controls"));
                const isHidden = input.type === "password";
                const label = isHidden ? "Hide" : "Show";
                const passwordName = input.id === "password" ? "password" : "confirm password";

                input.type = isHidden ? "text" : "password";
                this.setAttribute("aria-label", `${label} ${passwordName}`);
                this.setAttribute("title", `${label} ${passwordName}`);
                this.querySelector("i").classList.toggle("fa-eye", !isHidden);
                this.querySelector("i").classList.toggle("fa-eye-slash", isHidden);
            });

            $.validator.addMethod("strongPassword", function (value, element) {
                return this.optional(element) || /^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9\s])\S+$/.test(value);
            }, "Use at least one letter, one number, and one symbol.");

            $("#register-form").validate({
                rules: {
                    username: { 
                        required: true, 
                        minlength: 3, 
                        maxlength: 20 
                    },

                    email: { 
                        required: true, 
                        email: true, 
                        maxlength: 254 
                    },
                    
                    phone: {
                        required: true, 
                        digits: true, 
                        minlength: 7, 
                        maxlength: 15 
                    },

                    password: {
                        required: true,
                        minlength: 8,
                        maxlength: 32,
                        strongPassword: true
                    },

                    confirm_password: {
                        required: true,
                        minlength: 8,
                        maxlength: 32,
                        equalTo: "#password"
                    }
                    
                },
                messages: {
                    username: {
                        required: "Please enter a username.",
                        minlength: "Username must be at least 3 characters.",
                        maxlength: "Username cannot exceed 20 characters."
                    },
                    email: {
                        required: "Please enter your email address.",
                        email: "Please enter a valid email address.",
                        maxlength: "Email cannot exceed 254 characters."
                    },
                    phone: {
                        required: "Please enter your phone number.",
                        digits: "Phone number can contain numbers only.",
                        minlength: "Phone number must be at least 7 digits.",
                        maxlength: "Phone number cannot exceed 15 digits."
                    },
                    password: {
                        required: "Please enter a password.",
                        minlength: "Password must be at least 8 characters.",
                        maxlength: "Password cannot exceed 32 characters."
                    },
                    confirm_password: {
                        required: "Please confirm your password.",
                        minlength: "Password must be at least 8 characters.",
                        maxlength: "Password cannot exceed 32 characters.",
                        equalTo: "Passwords do not match."
                    }
                },
                errorPlacement: function (error, element) {
                    error.appendTo(element.closest(".input-group"));
                },
                errorElement: "small",
                errorClass: "validation-error",
                submitHandler: function () {
                    const feedback = document.getElementById("registration-feedback");
                    feedback.textContent = "Registration successful! You can now log in.";
                    feedback.hidden = false;
                    return false;
                }
            });
        });
    </script>

</body>
</html>
